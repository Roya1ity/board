<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <nav class="tabs" aria-label="주요 메뉴">
      <button class="tab is-active" data-view="login">로그인</button>
      <button class="tab" data-view="board">게시판</button>
      <button class="tab admin-only hidden" data-view="admin">관리자페이지</button>
    </nav>
    <div class="session">
      <div class="notify-wrap hidden" id="notifyWrap">
        <button id="notifyBtn" class="icon-button" type="button" aria-label="알림">
          <span class="bell-icon" aria-hidden="true"></span>
          <span id="notifyBadge" class="notify-badge hidden">0</span>
        </button>
        <div id="notifyPopup" class="notify-popup hidden">
          <div class="notify-head">
            <strong>알림</strong>
            <button id="closeNotifyBtn" class="link-button" type="button">닫기</button>
          </div>
          <div id="notifyList" class="notify-list"></div>
        </div>
      </div>
      <span id="userBadge" class="user-badge">로그인 전</span>
      <button id="logoutBtn" class="button ghost hidden" type="button">로그아웃</button>
    </div>
  </header>

  <main>
    <section id="notice" class="notice hidden" role="status"></section>

    <section id="loginView" class="view auth-view">
      <div class="auth-panel">
        <h1>로그인</h1>
        <p id="loginMessage" class="muted"></p>
        <div class="oauth-actions">
          <a class="button oauth kakao" href="/oauth2/authorization/kakao">카카오 로그인</a>
          <a class="button oauth google" href="/oauth2/authorization/google">구글 로그인</a>
        </div>
      </div>
    </section>

    <section id="boardView" class="view hidden board-view">
      <section class="band">
        <div class="section-head">
          <div>
            <h2>게시판 목록</h2>
            <p class="muted">게시판을 선택하면 아래에 글 목록이 표시됩니다.</p>
          </div>
          <button id="refreshBoardsBtn" class="button secondary" type="button">새로고침</button>
        </div>
        <div id="boardList" class="board-grid"></div>
      </section>

      <section class="band split">
        <div class="panel">
          <div class="section-head compact">
            <div>
                <h2 id="selectedBoardLabel" class="muted">게시판을 선택하세요.</h2>
            </div>
            <button id="openPostFormBtn" class="button accent hidden" type="button">글쓰기</button>
          </div>
          <form id="postForm" class="form hidden">
            <input id="postTitle" name="title" type="text" placeholder="제목" maxlength="120" required>
            <textarea id="postBody" name="body" rows="6" placeholder="내용" required></textarea>
            <input id="postImages" name="images" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
            <div class="form-actions">
              <button class="button accent" type="submit">등록</button>
              <button id="cancelPostFormBtn" class="button ghost" type="button">취소</button>
            </div>
          </form>
          <div id="postList" class="list"></div>
          <div id="postPager" class="pager"></div>
        </div>

        <div class="panel">
          <div class="section-head compact">
            <div>
              <h2 id="postDetailTitle">게시글 제목</h2>
              <div class="post-meta-row">
                <p id="postMeta" class="muted">글을 선택하세요.</p>
                <div id="postMetaActions" class="post-actions"></div>
              </div>
            </div>
          </div>
          <article id="postDetail" class="post-detail empty">선택된 포스트가 없습니다.</article>
        </div>
      </section>

      <section class="band">
        <div class="section-head compact">
          <div>
            <p id="commentMeta" class="muted">포스트를 선택하면 댓글이 표시됩니다.</p>
          </div>
          <button id="openCommentFormBtn" class="button accent hidden" type="button">댓글달기</button>
        </div>
        <form id="commentForm" class="form inline hidden">
          <textarea id="commentContent" name="content" rows="4" placeholder="댓글 내용" required></textarea>
          <input id="parentCommentId" type="hidden">
          <div class="form-actions">
            <button class="button accent" type="submit">등록</button>
            <button id="cancelCommentFormBtn" class="button ghost" type="button">취소</button>
          </div>
        </form>
        <div id="commentList" class="comments"></div>
        <div id="commentPager" class="pager"></div>
      </section>
    </section>

    <section id="adminView" class="view hidden">
      <section class="band admin-layout">
        <div class="panel">
          <h2>게시판 생성</h2>
          <form id="boardForm" class="form">
            <input id="boardName" name="name" type="text" placeholder="게시판 이름" maxlength="80" required>
            <textarea id="boardDescription" name="description" rows="5" placeholder="게시판 설명"></textarea>
            <button class="button accent" type="submit">게시판 생성</button>
          </form>
        </div>
        <div class="panel">
          <h2>게시판 관리</h2>
          <div id="adminBoardList" class="list"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
